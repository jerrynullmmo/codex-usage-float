name: Build and test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test accounting and conversation matching
        run: zsh scripts/test.sh
      - name: Build and verify application
        run: zsh build.sh
      - name: Verify release packaging
        run: zsh scripts/package.sh

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up release Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.7'
          architecture: x64
      - name: Install build dependencies
        run: python -m pip install -r windows/requirements-build.txt
      - name: Test and build Windows package
        run: powershell -NoProfile -File windows/build.ps1
